services:
  arlm-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - arlm-server-data:/data
      # server.toml é um arquivo do HOST montado no container (plan 020).
      - ./docker/server.toml:/etc/arlm/server.toml:ro
      # Descomente para BGE-M3 local (e ajuste [embedder] no server.toml):
      # - ./models/bge-m3:/models:ro
    ports:
      - "50051:50051"
    environment:
      - ARLM_DATA_DIR=/data/arlm
      - ARLM_SERVER_CONFIG=/etc/arlm/server.toml
      - RUST_LOG=info,arlm_server=debug
    command: ["up"]

volumes:
  arlm-server-data:
