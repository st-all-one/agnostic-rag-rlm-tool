services:
  arags-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    volumes:
      - arags-server-data:/data
      # server.toml é um arquivo do HOST montado no container (plan 020).
      - ./docker/server.toml:/etc/arags/server.toml:ro
      # Descomente para BGE-M3 local (e ajuste [embedder] no server.toml):
      # - ./models/bge-m3:/models:ro
    ports:
      - "50051:50051"
    environment:
      - ARAGS_DATA_DIR=/data/arags
      - ARAGS_SERVER_CONFIG=/etc/arags/server.toml
      - RUST_LOG=info,arags_server=debug
    command: ["up"]

volumes:
  arags-server-data:
