syntax = "proto3";
package arlm.v1;

// ── Search ──

message SearchRequest {
  string project = 1;
  string query = 2;
  int32 max_results = 3;
  SearchTier tier = 4;
  bool include_summaries = 5;  // default: true
  bool include_raw = 6;        // default: true
}

enum SearchTier {
  // Wire-default: the server resolves it to its `[search].tier` default
  // (plan 020). Clients that need a specific tier send it explicitly.
  SEARCH_TIER_UNSPECIFIED = 0;
  TIER_BM25 = 1;
  TIER_SEMANTIC = 2;
  TIER_HYBRID = 3;
  TIER_ENTITY = 4;
}

message SearchResult {
  int64 chunk_id = 1;
  string text = 2;
  float score = 3;
  string file_path = 4;
  int32 start_line = 5;
  int32 end_line = 6;
  bool is_summary = 7;
  SummaryInfo summary = 8;
}

message SummaryInfo {
  string summary_text = 1;
  int64 raw_chunk_count = 2;
  float confidence = 3;
}

message SearchResponse {
  repeated SearchResult results = 1;
  int32 total_count = 2;
  double duration_ms = 3;
}
