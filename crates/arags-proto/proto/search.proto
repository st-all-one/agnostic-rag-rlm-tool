syntax = "proto3";
package arags.v1;

// ── Search ──

message SearchRequest {
  string project = 1;
  string query = 2;
  int32 max_results = 3;
  SearchTier tier = 4;
  reserved 5, 6; // removed: include_summaries, include_raw (plan 019/020: no summaries layer)
}

enum SearchTier {
  // Wire-default: the server resolves it to its `[search].tier` default
  // (plan 020). Clients that need a specific tier send it explicitly.
  SEARCH_TIER_UNSPECIFIED = 0;
  TIER_BM25 = 1;
  TIER_SEMANTIC = 2;
  TIER_HYBRID = 3;
  TIER_ENTITY = 4;
  // Search the RLM recursive summary dataset (L1/L2/L3 nodes) instead of
  // chunks. Only approved, non-stale summaries are returned.
  TIER_SUMMARY = 5;
}

message SearchResult {
  int64 chunk_id = 1;
  string text = 2;
  float score = 3;
  string file_path = 4;
  int32 start_line = 5;
  int32 end_line = 6;
}

// Approved RLM summary surfaced alongside chunk results (plan 023 unified
// query). `node_id` is the stable node id; `rowid` mirrors the rowid.
message SummaryHit {
  string node_id = 1;
  int64 rowid = 2;
  int32 level = 3;
  string subject = 4;
  string summary_text = 5;
  // Normalised fusion score in [0, 1].
  float score = 6;
}

// Compact exploration-map reference for unified query responses (the full
// body and audit fields live in GetExplorationById).
message ExplorationRef {
  string exploration_id = 1;
  string goal = 2;
  string summary = 3;
  // Composite trust score in [0, 1].
  float confidence = 4;
}

message SearchResponse {
  repeated SearchResult results = 1;
  int32 total_count = 2;
  double duration_ms = 3;
  // Unified query (plan 023): approved RLM summaries relevant to the query,
  // fused with the chunk results according to `[search].summary_ratio`.
  repeated SummaryHit summaries = 4;
  // Unified query: relevant exploration maps (fresh, above the configured
  // confidence gate).
  repeated ExplorationRef explorations = 5;
}
