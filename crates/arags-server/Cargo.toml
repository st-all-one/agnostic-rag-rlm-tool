[package]
name = "arags-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Long-running gRPC data-plane server for arags (Agnostic RAG Server)"

[[bin]]
name = "arags-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
arags-core.workspace = true
arags-storage.workspace = true
arags-search.workspace = true
arags-embedding.workspace = true
arags-memory.workspace = true
arags-proto.workspace = true
rusqlite.workspace = true
clap.workspace = true
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync"] }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
futures.workspace = true
rayon.workspace = true
num_cpus.workspace = true
sha2.workspace = true
hex.workspace = true
zstd.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# No embedding backend is enabled by default: the shipped binary uses the
# in-process candle `Minilm` embedder (portable, no C++/Vulkan toolchain), and
# `kind = "ollama"` is available for GPU via a local Ollama daemon. The
# self-contained `llama.cpp` + Vulkan backend is OPT-IN — it requires a Vulkan
# SDK (and a Vulkan device at runtime) to build, so it must NOT be in the
# default feature set, otherwise `cargo build`/CI/Docker break (no cmake/Vulkan
# in Alpine, fragile cross-compiles, non-portable release binaries).
default = []
llamacpp = ["arags-embedding/llamacpp"]
# NOTE: `llamacpp-vulkan` must also enable the server's own `llamacpp` feature
# so the `#[cfg(feature = "llamacpp")]` code paths (e.g. the `llama_cpp_model` /
# `llama_cpp_gpu_layers` fields in `state.rs`'s `EmbeddingConfig` builders) are
# compiled — otherwise the build fails with E0063 when only this feature is set.
llamacpp-vulkan = ["llamacpp", "arags-embedding/llamacpp-vulkan"]
