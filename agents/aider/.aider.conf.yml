# .aider.conf.yml — Configuração do arags para Aider
#
# Instalar:
#   Copie este arquivo para .aider.conf.yml na raiz do projeto
#   Certifique-se de que 'arags' está no PATH
#
# Uso:
#   arags context automaticamente enriquece o contexto do Aider

rlm_context:
  command: "arags context \"{question}\" --project . --format prompt"
  inject: true
  priority: 10

rlm_search:
  command: "arags search \"{question}\" --project . --format json"
  inject: false
  priority: 20
