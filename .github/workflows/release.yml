name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # AlmaLinux runs inside a glibc container on the Ubuntu host runner.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian (glibc x86_64)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: arags-debian-amd64
            server_artifact: arags-server-debian-amd64
          # musl x86_64 — built NATIVELY inside rust:1-alpine. The SIMD C deps
          # (numkong, pulled in by tokenizers) need a modern GCC + musl-g++, which
          # Alpine provides; zig/clang and old glibc GCC both fail to compile it.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            container: rust:1-alpine
            artifact: arags-linux-musl-amd64
            server_artifact: arags-server-linux-musl-amd64
            musl: true
          # AlmaLinux (glibc x86_64 via container; needs GCC 13 toolset for numkong)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: almalinux:9
            artifact: arags-almalinux-amd64
            server_artifact: arags-server-almalinux-amd64
            almalinux: true
          # Linux ARM64 (glibc, nativo em runner arm)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: arags-linux-gnu-arm64
            server_artifact: arags-server-linux-gnu-arm64
          # musl aarch64 — built NATIVELY inside rust:1-alpine (arm64 runner)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            container: rust:1-alpine
            artifact: arags-linux-musl-arm64
            server_artifact: arags-server-linux-musl-arm64
            musl: true
          # Windows Server (x86_64-pc-windows-msvc)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: arags-windows-amd64.exe
            server_artifact: arags-server-windows-amd64.exe
          # macOS — ARM only (Apple Silicon). No x86_64 macOS target.
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: arags-macos-arm64
            server_artifact: arags-server-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install container dependencies (AlmaLinux)
        if: matrix.almalinux
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled crb || crb enable
          # curl-minimal already provides /usr/bin/curl on AlmaLinux 9 and
          # conflicts with the full curl package, so install it explicitly.
          # protobuf-devel ships the well-known google/protobuf/*.proto types that
          # prost-build needs; PROTOC_INCLUDE points protoc at them.
          dnf install -y curl-minimal tar gzip make protobuf-compiler protobuf-devel ca-certificates
          # numkong (pulled in by tokenizers) needs a modern compiler: it uses
          # avx512fp16/amx-fp16 target attributes absent from the base GCC 11.
          # gcc-toolset-13 (GCC 13) provides them; put it first on PATH.
          dnf install -y gcc-toolset-13 gcc-toolset-13-gcc-c++
          echo "PATH=/opt/rh/gcc-toolset-13/root/usr/bin:$PATH" >> "$GITHUB_ENV"
          echo "PROTOC_INCLUDE=/usr/include" >> "$GITHUB_ENV"

      # musl targets are built NATIVELY inside rust:1-alpine (Alpine ships a
      # modern GCC + musl-g++ that the SIMD C deps, e.g. numkong, require).
      # rustup is glibc-only and cannot run in Alpine, so we use the image's
      # preinstalled Rust toolchain instead of dtolnay/rust-toolchain.
      - name: Install Alpine build dependencies (musl)
        if: matrix.musl
        run: |
          apk add --no-cache g++ protobuf protobuf-dev git bash
          echo "PROTOC_INCLUDE=/usr/include" >> "$GITHUB_ENV"
          # Statically link the C++/gcc runtimes so the musl binary is portable.
          echo "RUSTFLAGS=-C link-arg=-static-libstdc++ -C link-arg=-static-libgcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        if: ${{ !matrix.musl }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (non-container, all OSes)
        if: matrix.container == ''
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CLI binary
        run: cargo build --release --bin arags --target ${{ matrix.target }}

      - name: Build server binary
        run: cargo build --release --bin arags-server --target ${{ matrix.target }}

      - name: Rename artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/arags ${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/arags-server ${{ matrix.server_artifact }}
          chmod +x ${{ matrix.artifact }} ${{ matrix.server_artifact }}

      - name: Rename artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/arags.exe ${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/arags-server.exe ${{ matrix.server_artifact }}

      # Server tarball consumed by the Docker build (one per Linux target, named
      # after the full rust triple so the Dockerfile can resolve it by TARGETARCH).
      - name: Package server tarball (Linux)
        if: contains(matrix.target, 'linux')
        run: |
          tar czf "arags-server-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" arags-server

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.server_artifact }}
          path: ${{ matrix.server_artifact }}
          retention-days: 1

      - name: Upload server tarball (Docker)
        if: contains(matrix.target, 'linux')
        uses: actions/upload-artifact@v4
        with:
          name: arags-server-${{ matrix.target }}.tar.gz
          path: arags-server-${{ matrix.target }}.tar.gz
          retention-days: 1

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/arags-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Dockerfile pulls the prebuilt static musl server binary for the
          # target arch directly from the GitHub Release (no compile). ARAGS_REPO
          # + ARAGS_VERSION let it build the per-arch asset URL from TARGETARCH.
          build-args: |
            ARAGS_REPO=${{ github.repository }}
            ARAGS_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build sha256sums.txt
        run: |
          cd artifacts
          sha256sum arags* > sha256sums.txt
          cat sha256sums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/arags-*
            artifacts/sha256sums.txt
          draft: false
          prerelease: false
