name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: arags-linux-amd64
            server_artifact: arags-server-linux-amd64
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: arags-linux-arm64
            server_artifact: arags-server-linux-arm64
            cross: true
          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: arags-macos-amd64
            server_artifact: arags-server-macos-amd64
          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: arags-macos-arm64
            server_artifact: arags-server-macos-arm64
          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: arags-windows-amd64.exe
            server_artifact: arags-server-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build CLI binary
        run: |
          cargo build --release --bin arags --target ${{ matrix.target }}

      - name: Build server binary
        run: |
          cargo build --release --bin arags-server --target ${{ matrix.target }}

      - name: Rename artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/arags ${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/arags-server ${{ matrix.server_artifact }}
          chmod +x ${{ matrix.artifact }} ${{ matrix.server_artifact }}

      - name: Rename artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/arags.exe ${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/arags-server.exe ${{ matrix.server_artifact }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.server_artifact }}
          path: ${{ matrix.server_artifact }}
          retention-days: 1

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: arags-server-linux-amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/arags-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, docker]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create checksums
        run: |
          find . -type f -not -name '*.sha256' -not -name '*.yml' | while read f; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            arags-*
            arags-server-*
          draft: false
          prerelease: false
