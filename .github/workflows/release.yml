name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # AlmaLinux runs inside a glibc container on the Ubuntu host runner.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian (glibc x86_64)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: arags-debian-amd64
            server_artifact: arags-server-debian-amd64
          # musl (x86_64-unknown-linux-musl, fully static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: arags-linux-musl-amd64
            server_artifact: arags-server-linux-musl-amd64
            musl: true
          # AlmaLinux (glibc x86_64 via container)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            container: almalinux:9
            artifact: arags-almalinux-amd64
            server_artifact: arags-server-almalinux-amd64
          # Windows Server (x86_64-pc-windows-msvc)
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: arags-windows-amd64.exe
            server_artifact: arags-server-windows-amd64.exe
          # macOS — ARM only (Apple Silicon). No x86_64 macOS target.
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: arags-macos-arm64
            server_artifact: arags-server-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install container dependencies (AlmaLinux)
        if: matrix.container != ''
        run: |
          dnf install -y epel-release
          dnf install -y curl tar gzip gcc-c++ make protobuf-compiler ca-certificates

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl target & tools
        if: matrix.musl
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Install protoc (non-container Linux/macOS)
        if: matrix.container == '' && runner.os != 'Windows'
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            brew install protobuf
          else
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          fi

      - name: Build CLI binary
        run: cargo build --release --bin arags --target ${{ matrix.target }}

      - name: Build server binary
        run: cargo build --release --bin arags-server --target ${{ matrix.target }}

      - name: Rename artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/arags ${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/arags-server ${{ matrix.server_artifact }}
          chmod +x ${{ matrix.artifact }} ${{ matrix.server_artifact }}

      - name: Rename artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/arags.exe ${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/arags-server.exe ${{ matrix.server_artifact }}

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.server_artifact }}
          path: ${{ matrix.server_artifact }}
          retention-days: 1

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Pull the prebuilt static musl server binary and wrap it as the
      # tarball the Dockerfile expects via ARAGS_LOCAL_TARBALL (keeps the
      # default source-build path intact when this arg is empty).
      - name: Download musl server binary
        uses: actions/download-artifact@v4
        with:
          name: arags-server-linux-musl-amd64

      - name: Package musl binary as tarball
        run: |
          mv arags-server-linux-musl-amd64 arags-server
          chmod +x arags-server
          tar czf arags-server-linux-musl-amd64.tar.gz arags-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/arags-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ARAGS_LOCAL_TARBALL=arags-server-linux-musl-amd64.tar.gz
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, docker]
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          find artifacts -type f -not -name '*.sha256' | while read f; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            artifacts/arags-*
            artifacts/arags-server-*
          draft: false
          prerelease: false
