[build]
jobs = 8
# Portable baseline for committed/CI/release builds. Binaries run on commodity
# CI runners and most x86-64 machines. Developers who want max-local perf can
# opt into native tuning without editing this file by overriding via env:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release
rustflags = ["-C", "target-cpu=x86-64-v2"]

# ring 0.17.x panics at const-eval on aarch64 targets with recent rustc because
# the `neon` target-feature cfg is not set at compile time. Force it so ring's
# CPU-feature assertions pass (see ring#2149). These per-target flags also
# override the x86-only `target-cpu=x86-64-v2` global flag on those targets.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-feature=+neon"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+neon"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+neon"]

[alias]
c = "check"
b = "build"
r = "run"
t = "test"
cl = "clippy"
