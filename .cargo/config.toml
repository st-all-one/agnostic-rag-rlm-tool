[build]
jobs = 8
# Portable baseline for committed/CI/release builds. Binaries run on commodity
# CI runners and most x86-64 machines. Developers who want max-local perf can
# opt into native tuning without editing this file by overriding via env:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release
rustflags = ["-C", "target-cpu=x86-64-v2"]

[env]
PROTOC = "/usr/bin/protoc"

[alias]
c = "check"
b = "build"
r = "run"
t = "test"
cl = "clippy"
